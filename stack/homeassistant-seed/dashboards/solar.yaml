# The Solar dashboard. Ships with the solar monitor and is replaced on every update.
# To make your own, create a new dashboard in Settings -> Dashboards and copy cards from this file.
title: Solar
views:
  - title: Solar
    path: solar
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
          - type: markdown
            grid_options: {columns: full}
            content: >-
              {% for a in state_attr('sensor.site_alerts', 'alerts') or [] %}
              <ha-alert alert-type="warning">{{ a }}</ha-alert>
              {% endfor %}
            visibility:
              - condition: numeric_state
                entity: sensor.site_alerts
                above: 0
          - type: markdown
            grid_options: {columns: full}
            content: >-
              <ha-alert alert-type="{{ 'warning' if is_state('sensor.site_generator_advice', 'warn') else 'success' }}">
              {{ state_attr('sensor.site_generator_advice', 'advice_text') }}</ha-alert>
            visibility:
              - condition: state
                entity: sensor.site_generator_advice
                state_not: none
              - condition: state
                entity: sensor.site_generator_advice
                state_not: info
          - type: gauge
            entity: sensor.site_battery_level
            name: Battery
            grid_options: {columns: full}
            min: 0
            max: 100
            needle: false
            severity: {green: 50, yellow: 25, red: 0}
          - type: tile
            entity: sensor.site_battery_stored
            name: Stored
          - type: tile
            entity: sensor.site_battery_runtime
            name: Lasts about
          - type: tile
            entity: sensor.site_solar_power
            name: Solar
            color: amber
          - type: tile
            entity: sensor.site_house_load
            name: House
            color: blue
          - type: tile
            entity: sensor.site_battery_power
            name: Battery (+ charging)
            color: green
          - type: tile
            entity: sensor.site_generator_power
            name: Generator
            color: purple
            visibility:
              - condition: state
                entity: sensor.site_generator_advice
                attribute: generator_mode
                state_not: none

      - type: grid
        cards:
          - type: heading
            heading: Today
          - type: tile
            entity: sensor.site_solar_today
            name: Solar made
            color: amber
          - type: tile
            entity: sensor.site_used_today
            name: House used
            color: blue
          - type: tile
            entity: sensor.site_battery_charged_today
            name: Charged
            color: green
          - type: tile
            entity: sensor.site_battery_discharged_today
            name: Discharged
            color: green
          - type: tile
            entity: sensor.site_generator_today
            name: Generator
            color: purple
          - type: tile
            entity: sensor.site_dongles_connected
            name: Dongles
          - type: tile
            entity: sensor.site_generator_hours_since_service
            name: Generator since service
            color: purple
            visibility:
              - condition: state
                entity: sensor.site_generator_hours_since_service
                state_not: unknown
          - type: tile
            entity: sensor.site_generator_last_run
            name: Generator last ran
            color: purple
            visibility:
              - condition: state
                entity: sensor.site_generator_last_run
                state_not: unknown
          - type: tile
            entity: sensor.site_solar_forecast_today
            name: Forecast today
            color: amber
          - type: tile
            entity: sensor.site_solar_forecast_tomorrow
            name: Forecast tomorrow
            color: amber
          - type: heading
            heading: Last 14 days
          - type: statistics-graph
            grid_options: {columns: full}
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types: [change]
            entities:
              - entity: sensor.site_solar_today
                name: Solar
              - entity: sensor.site_used_today
                name: House
              - entity: sensor.site_generator_today
                name: Generator

      - type: grid
        cards:
          - type: heading
            heading: Battery health
          - type: markdown
            grid_options: {columns: full}
            content: >-
              <ha-alert alert-type="{{ {'warn': 'warning', 'note': 'info', 'ok': 'success'}.get(states('sensor.site_battery_health'), 'info') }}">
              {{ state_attr('sensor.site_battery_health', 'battery_health_text') or 'No battery health findings yet.' }}</ha-alert>
          - type: tile
            entity: sensor.site_battery_spread_top
            name: Cell spread when full
          - type: tile
            entity: sensor.site_battery_soh
            name: State of health
          - type: tile
            entity: sensor.site_battery_temp_min
            name: Coldest cell
          - type: tile
            entity: sensor.site_battery_temp_max
            name: Warmest cell
          - type: tile
            entity: sensor.site_battery_cycles
            name: Cycles
          - type: tile
            entity: sensor.site_battery_capacity_estimate
            name: Capacity estimate

      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
          - type: history-graph
            grid_options: {columns: full}
            hours_to_show: 24
            entities:
              - entity: sensor.site_solar_power
                name: Solar
              - entity: sensor.site_house_load
                name: House
              - entity: sensor.site_generator_power
                name: Generator
          - type: history-graph
            grid_options: {columns: full}
            hours_to_show: 24
            entities:
              - entity: sensor.site_battery_level
                name: Battery
          - type: heading
            heading: Alerts
          - type: entities
            grid_options: {columns: full}
            show_header_toggle: false
            entities:
              - entity: automation.solar_battery_low
                name: Battery low
              - entity: automation.solar_inverter_fault
                name: Inverter fault
              - entity: automation.solar_dongle_offline
                name: Dongle offline
              - entity: automation.solar_no_data
                name: No data
              - entity: automation.solar_start_the_generator
                name: Start the generator
              - entity: automation.solar_daily_summary
                name: Daily summary
              - entity: automation.solar_backup_overdue
                name: Backup overdue
              - entity: automation.solar_battery_needs_attention
                name: Battery needs attention
              - entity: automation.solar_generator_service_due
                name: Generator service due
              - entity: sensor.site_last_backup
                name: Last backup
          - type: markdown
            grid_options: {columns: full}
            content: >-
              Alerts show up in Home Assistant's notifications and on every phone with the
              Home Assistant app signed in to this box. Switch one off here to stop it.
