# Solar monitor: site sensors, alerts and the Solar dashboard.
# Ships with the solar monitor and is replaced on every update; edits here are overwritten.
# To change an alert, turn the automation off (Settings -> Automations) and make your own copy.
#
# Every figure comes from the box's own /api/ha, the same numbers and alerts as the wall
# display (all inverters added up), so it works for any number of inverters and dongles.

rest:
  - resource: http://127.0.0.1/api/ha
    scan_interval: 30
    timeout: 20
    sensor:
      - name: Site battery level
        unique_id: site_battery_level
        value_template: "{{ value_json.battery_level }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: Site solar power
        unique_id: site_solar_power
        value_template: "{{ value_json.solar_power }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
      - name: Site house load
        unique_id: site_house_load
        value_template: "{{ value_json.house_load }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
      - name: Site battery power
        unique_id: site_battery_power
        # positive = charging, negative = discharging
        value_template: "{{ value_json.battery_power }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging
      - name: Site generator power
        unique_id: site_generator_power
        value_template: "{{ value_json.generator_power }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:engine
      # Propane module (level and gallons come straight from the tank sensor's own entities)
      - name: Site propane days left
        unique_id: site_propane_days_left
        availability: "{{ value_json.propane_days_left is defined and value_json.propane_days_left is not none }}"
        value_template: "{{ value_json.propane_days_left }}"
        unit_of_measurement: d
        icon: mdi:gas-cylinder
      - name: Site propane used today
        unique_id: site_propane_used_today
        availability: "{{ value_json.propane_used_today is defined and value_json.propane_used_today is not none }}"
        value_template: "{{ value_json.propane_used_today }}"
        unit_of_measurement: gal
        icon: mdi:gas-cylinder
      - name: Site propane used yesterday
        unique_id: site_propane_used_yesterday
        availability: "{{ value_json.propane_used_yesterday is defined and value_json.propane_used_yesterday is not none }}"
        value_template: "{{ value_json.propane_used_yesterday }}"
        unit_of_measurement: gal
        icon: mdi:gas-cylinder
      # Water module (monitoring only; the pump plug, tank and meter are Home Assistant's own entities)
      - name: Site water pump run today
        unique_id: site_water_pump_run_today_min
        availability: "{{ value_json.water_pump_run_today_min is defined and value_json.water_pump_run_today_min is not none }}"
        value_template: "{{ value_json.water_pump_run_today_min }}"
        unit_of_measurement: min
        icon: mdi:water-pump
      - name: Site water pump starts today
        unique_id: site_water_pump_starts_today
        availability: "{{ value_json.water_pump_starts_today is defined and value_json.water_pump_starts_today is not none }}"
        value_template: "{{ value_json.water_pump_starts_today }}"
        icon: mdi:water-pump
      - name: Site water used today
        unique_id: site_water_used_today
        availability: "{{ value_json.water_used_today is defined and value_json.water_used_today is not none }}"
        value_template: "{{ value_json.water_used_today }}"
        unit_of_measurement: gal
        icon: mdi:water
      - name: Site water days left
        unique_id: site_water_days_left
        availability: "{{ value_json.water_days_left is defined and value_json.water_days_left is not none }}"
        value_template: "{{ value_json.water_days_left }}"
        unit_of_measurement: d
        icon: mdi:water
      - name: Site water tank level
        unique_id: site_water_tank_percent
        availability: "{{ value_json.water_tank_percent is defined and value_json.water_tank_percent is not none }}"
        value_template: "{{ value_json.water_tank_percent }}"
        unit_of_measurement: "%"
        icon: mdi:water-percent
      - name: Site water alert
        unique_id: site_water_alert
        availability: "{{ value_json.water_alert is defined and value_json.water_alert is not none }}"
        value_template: "{{ value_json.water_alert }}"
        icon: mdi:water-alert
      # Boiler module (monitoring only; the probes, plugs and thermostat are Home Assistant's own entities)
      - name: Site boiler state
        unique_id: site_boiler_state
        availability: "{{ value_json.boiler_state is defined and value_json.boiler_state is not none }}"
        value_template: "{{ value_json.boiler_state }}"
        icon: mdi:water-boiler
      - name: Site boiler fault
        unique_id: site_boiler_fault
        availability: "{{ value_json.boiler_fault is defined }}"
        value_template: "{{ value_json.boiler_fault if value_json.boiler_fault else 'none' }}"
        icon: mdi:water-boiler-alert
      - name: Site floor heat difference
        unique_id: site_floor_heat_difference
        availability: "{{ value_json.boiler_floor_difference is defined and value_json.boiler_floor_difference is not none }}"
        value_template: "{{ value_json.boiler_floor_difference }}"
        unit_of_measurement: "°C"
        state_class: measurement   # no device_class: Home Assistant would convert a difference as a temperature
        icon: mdi:thermometer-lines
      - name: Site floor heat output
        unique_id: site_floor_heat_output
        availability: "{{ value_json.boiler_heat_output is defined and value_json.boiler_heat_output is not none }}"
        value_template: "{{ value_json.boiler_heat_output }}"
        unit_of_measurement: BTU/h
        state_class: measurement
        icon: mdi:heat-wave
      - name: Site floor heat today
        unique_id: site_floor_heat_today
        availability: "{{ value_json.boiler_heat_today is defined and value_json.boiler_heat_today is not none }}"
        value_template: "{{ value_json.boiler_heat_today }}"
        unit_of_measurement: kBTU
        state_class: total_increasing
        icon: mdi:heat-wave
      - name: Site house heat loss
        unique_id: site_house_heat_loss
        availability: "{{ value_json.boiler_heat_loss is defined and value_json.boiler_heat_loss is not none }}"
        value_template: "{{ value_json.boiler_heat_loss }}"
        unit_of_measurement: BTU/h/°F
        state_class: measurement
        icon: mdi:home-thermometer-outline
      - name: Site boiler efficiency
        unique_id: site_boiler_efficiency
        availability: "{{ value_json.boiler_efficiency is defined and value_json.boiler_efficiency is not none }}"
        value_template: "{{ value_json.boiler_efficiency }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:fire-circle
      - name: Site boiler reset state
        unique_id: site_boiler_reset_state
        availability: "{{ value_json.boiler_reset_state is defined }}"
        value_template: "{{ value_json.boiler_reset_state }}"
        icon: mdi:restart
      - name: Site boiler reset blocked
        unique_id: site_boiler_reset_blocked
        availability: "{{ value_json.boiler_reset_blocked is defined }}"
        value_template: "{{ value_json.boiler_reset_blocked if value_json.boiler_reset_blocked else 'no' }}"
        icon: mdi:restart-off
      - name: Site boiler burner today
        unique_id: site_boiler_burner_today
        availability: "{{ value_json.boiler_burner_minutes_today is defined }}"
        value_template: "{{ value_json.boiler_burner_minutes_today }}"
        unit_of_measurement: min
        icon: mdi:fire
      - name: Site solar today
        unique_id: site_solar_today
        value_template: "{{ value_json.solar_today }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant
      - name: Site used today
        unique_id: site_used_today
        value_template: "{{ value_json.used_today }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:home-lightning-bolt
      - name: Site battery charged today
        unique_id: site_battery_charged_today
        value_template: "{{ value_json.charged_today }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:battery-arrow-up
      - name: Site battery discharged today
        unique_id: site_battery_discharged_today
        value_template: "{{ value_json.discharged_today }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:battery-arrow-down
      - name: Site generator today
        unique_id: site_generator_today
        value_template: "{{ value_json.generator_today }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:engine
      - name: Site solar forecast today
        unique_id: site_solar_forecast_today
        # whole day; Open-Meteo, calibrated to this site's panels
        value_template: "{{ value_json.forecast_today }}"
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:weather-partly-cloudy
        json_attributes: [forecast_remaining]
      - name: Site solar forecast tomorrow
        unique_id: site_solar_forecast_tomorrow
        value_template: "{{ value_json.forecast_tomorrow }}"
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:weather-partly-cloudy
      - name: Site expected use tomorrow
        unique_id: site_expected_use_tomorrow
        # from the week's pattern of use where it predicts better than the 3-day average ("method" says which)
        availability: "{{ value_json.expected_use_tomorrow is defined and value_json.expected_use_tomorrow is not none }}"
        value_template: "{{ value_json.expected_use_tomorrow }}"
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:calendar-week
        json_attributes: [load_method]
      - name: Site battery stored
        unique_id: site_battery_stored
        value_template: "{{ value_json.battery_stored }}"
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery
      - name: Site battery runtime
        unique_id: site_battery_runtime
        # hours until the low battery level at the usual (3-day average) use
        value_template: "{{ value_json.battery_runtime }}"
        unit_of_measurement: h
        device_class: duration
        icon: mdi:timer-sand
        json_attributes: [usual_load, low_battery_level, battery_capacity]
      - name: Site dongles connected
        unique_id: site_dongles_connected
        value_template: "{{ value_json.dongles_connected }}"
        icon: mdi:wifi
        json_attributes: [dongles_expected, data_age]
      - name: Site inverter fault code
        unique_id: site_inverter_fault_code
        value_template: "{{ value_json.fault_code }}"
        icon: mdi:alert-circle-outline
        json_attributes: [warning_code]
      - name: Site alerts
        unique_id: site_alerts
        # number of open alerts; the texts are in the "alerts" attribute
        value_template: "{{ value_json.alerts | count }}"
        icon: mdi:alert
        json_attributes: [alerts]
      - name: Site generator advice
        unique_id: site_generator_advice
        # none (no hand-started generator), info (daytime), ok or warn
        value_template: "{{ value_json.advice }}"
        icon: mdi:engine
        json_attributes: [advice_text, advice_need_kwh, advice_run_hours, advice_empty_at, sunset, generator_mode]
      - name: Site daily summary
        unique_id: site_daily_summary
        # the day it covers; the message is in the attributes
        value_template: "{{ value_json.summary_day }}"
        icon: mdi:message-text-clock
        json_attributes: [summary_title, summary_text]
      - name: Site last backup
        unique_id: site_last_backup
        value_template: "{{ value_json.backup_last_ok }}"
        device_class: timestamp
        icon: mdi:usb-flash-drive
        json_attributes: [backup_configured, backup_message]
      # Battery health (battery.py; the box's Battery health page has the details)
      - name: Site battery health
        unique_id: site_battery_health
        # ok, note, warn or unknown
        value_template: "{{ value_json.battery_health }}"
        icon: mdi:battery-heart-variant
        json_attributes: [battery_health_text, battery_spread_top_day, battery_last_full, bms_fault_code, bms_warning_code, battery_bms_inverter]
      - name: Site battery cell spread when full
        unique_id: site_battery_spread_top
        value_template: "{{ value_json.battery_spread_top }}"
        unit_of_measurement: mV
        state_class: measurement
        icon: mdi:battery-sync
      - name: Site battery cell temperature low
        unique_id: site_battery_temp_min
        value_template: "{{ value_json.battery_temp_min }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Site battery cell temperature high
        unique_id: site_battery_temp_max
        value_template: "{{ value_json.battery_temp_max }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Site battery state of health
        unique_id: site_battery_soh
        value_template: "{{ value_json.battery_soh }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-heart
      - name: Site battery cycles
        unique_id: site_battery_cycles
        value_template: "{{ value_json.battery_cycles }}"
        state_class: total_increasing
        icon: mdi:battery-sync-outline
      - name: Site battery capacity estimate
        unique_id: site_battery_capacity_estimate
        value_template: "{{ value_json.battery_capacity_estimate }}"
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
      # Generator log (genlog.py): hours since the last service of the generator closest to its service
      - name: Site generator hours since service
        unique_id: site_generator_hours_since_service
        value_template: "{{ value_json.generator_hours_since_service }}"
        unit_of_measurement: h
        device_class: duration
        state_class: total_increasing
        icon: mdi:engine
        json_attributes: [generator_service_interval, generator_service_left]
      - name: Site generator last run
        unique_id: site_generator_last_run
        value_template: "{{ value_json.generator_last_run }}"
        device_class: timestamp
        icon: mdi:engine-outline
        json_attributes: [generator_last_run_hours, generator_runs_30d, generator_hours_30d]
      # The box itself (boxhealth.py): temperature, power supply, disk, SSD, containers, dongle drop-outs
      - name: Site box health
        unique_id: site_box_health
        # ok, note, warn or unknown
        value_template: "{{ value_json.box_health }}"
        icon: mdi:raspberry-pi
        json_attributes: [box_health_text]
      - name: Site box temperature
        unique_id: site_box_cpu_temp
        value_template: "{{ value_json.box_cpu_temp }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Site box disk free
        unique_id: site_box_disk_free
        value_template: "{{ value_json.box_disk_free }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:harddisk
      - name: Site box SSD wear
        unique_id: site_box_ssd_used
        value_template: "{{ value_json.box_ssd_used }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:harddisk-remove
    binary_sensor:
      # the boiler module: a fault it may reset now (packages/solar_boiler.yaml's automation does the reset)
      - name: Site boiler reset allowed
        unique_id: site_boiler_reset_allowed
        availability: "{{ value_json.boiler_reset_allowed is defined }}"
        value_template: "{{ value_json.boiler_reset_allowed }}"
        icon: mdi:restart-alert
      # the water module: the pump running now
      - name: Site water pump running
        unique_id: site_water_pump_running
        availability: "{{ value_json.water_pump_running is defined and value_json.water_pump_running is not none }}"
        value_template: "{{ value_json.water_pump_running }}"
        device_class: running
      - name: Site data stale
        unique_id: site_data_stale
        value_template: "{{ value_json.data_stale }}"
        device_class: problem
      - name: Site dongle offline
        unique_id: site_dongle_offline
        value_template: "{{ value_json.dongle_offline }}"
        device_class: problem
      - name: Site inverter fault
        unique_id: site_inverter_fault
        value_template: "{{ value_json.inverter_fault }}"
        device_class: problem
      - name: Site battery low
        unique_id: site_battery_low
        value_template: "{{ value_json.battery_low }}"
        device_class: battery
      - name: Site backup overdue
        unique_id: site_backup_overdue
        value_template: "{{ value_json.backup_overdue }}"
        device_class: problem
        icon: mdi:usb-flash-drive
      - name: Site battery needs attention
        unique_id: site_battery_attention
        value_template: "{{ value_json.battery_health == 'warn' }}"
        device_class: problem
        icon: mdi:battery-alert-variant
      - name: Site generator running
        unique_id: site_generator_running
        value_template: "{{ value_json.generator_running }}"
        device_class: running
        icon: mdi:engine
      - name: Site generator service due
        unique_id: site_generator_service_due
        value_template: "{{ value_json.generator_service_due }}"
        device_class: problem
        icon: mdi:oil
      - name: Site box needs attention
        unique_id: site_box_attention
        value_template: "{{ value_json.box_health == 'warn' }}"
        device_class: problem
        icon: mdi:raspberry-pi
      - name: Site box power problem
        unique_id: site_box_power_problem
        value_template: "{{ value_json.box_power_problem }}"
        device_class: problem
        icon: mdi:power-plug-off
      - name: Site generator needed
        unique_id: site_generator_needed
        value_template: "{{ value_json.generator_needed }}"
        device_class: problem
        icon: mdi:engine

script:
  solar_notify:
    alias: Solar monitor notification
    description: >-
      Shows a notification in Home Assistant and hands it to the solar monitor box, whose Notifications
      settings decide where it goes (phones, ntfy, the wall display) by its priority. If the box doesn't
      take it (Notifications turned off, or the box not answering), it goes to every phone with the
      Home Assistant app. message "clear" removes it again.
    mode: queued
    fields:
      tag:
        description: Notification id
      title:
        description: Title
      message:
        description: The text, or clear to remove the notification
      priority:
        description: critical, warning or info (left out, the box picks one from the tag)
    sequence:
      - if: "{{ message == 'clear' }}"
        then:
          - action: persistent_notification.dismiss
            data: {notification_id: "solar_{{ tag }}"}
        else:
          - action: persistent_notification.create
            data: {notification_id: "solar_{{ tag }}", title: "{{ title }}", message: "{{ message }}"}
      - action: rest_command.solar_notify_box
        continue_on_error: true
        response_variable: box
        data:
          tag: "{{ tag }}"
          title: "{{ title }}"
          message: "{{ message }}"
          priority: "{{ priority | default('') }}"
      - if: "{{ box is not defined or box.status != 200 or (box.content | string) != 'ok' }}"
        then:
          # The app's notify action is named after the phone, like its device_tracker entity.
          - repeat:
              for_each: >-
                {{ integration_entities('mobile_app') | select('match', 'device_tracker\.')
                   | map('replace', 'device_tracker.', '') | list }}
              sequence:
                - action: notify.mobile_app_{{ repeat.item }}
                  continue_on_error: true
                  data:
                    title: "{{ title }}"
                    message: "{{ 'clear_notification' if message == 'clear' else message }}"
                    data: {tag: "solar_{{ tag }}", group: solar}

automation:
  - id: solar_battery_low
    alias: "Solar: battery low"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_battery_low
        to: "on"
        for: "00:05:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_battery_low
        from: "on"
        to: "off"
        for: "00:10:00"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      # After a restart the sensor starts out "on" without a change to trigger on: wait, then check
      # it. (Top level on purpose: a condition inside if/then only ends that block, not the automation.)
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_battery_low', 'on') }}"
      - action: script.solar_notify
        data:
          tag: battery_low
          title: Battery low
          message: >-
            {% if trigger.id != 'off' %}Battery at {{ states('sensor.site_battery_level') }}%
            (alert level {{ state_attr('sensor.site_battery_runtime', 'low_battery_level') | int(0) }}%).
            The house is using {{ states('sensor.site_house_load') }} W.{% else %}clear{% endif %}

  - id: solar_inverter_fault
    alias: "Solar: inverter fault"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_inverter_fault
        to: "on"
        for: "00:01:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_inverter_fault
        from: "on"
        to: "off"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      # After a restart the sensor starts out "on" without a change to trigger on: wait, then check
      # it. (Top level on purpose: a condition inside if/then only ends that block, not the automation.)
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_inverter_fault', 'on') }}"
      - action: script.solar_notify
        data:
          tag: inverter_fault
          title: Inverter fault
          message: >-
            {% if trigger.id != 'off' %}An inverter reports fault code {{ states('sensor.site_inverter_fault_code') }}.
            Check the inverter's screen.{% else %}clear{% endif %}

  - id: solar_dongle_offline
    alias: "Solar: dongle offline"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_dongle_offline
        to: "on"
        for: "00:10:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_dongle_offline
        from: "on"
        to: "off"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      # After a restart the sensor starts out "on" without a change to trigger on: wait, then check
      # it. (Top level on purpose: a condition inside if/then only ends that block, not the automation.)
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_dongle_offline', 'on') }}"
      - action: script.solar_notify
        data:
          tag: dongle_offline
          title: Inverter dongle offline
          message: >-
            {% if trigger.id != 'off' %}Only {{ states('sensor.site_dongles_connected') }} of
            {{ state_attr('sensor.site_dongles_connected', 'dongles_expected') }} inverter dongles are connected.
            Check the dongle's WiFi or network cable.{% else %}clear{% endif %}

  - id: solar_no_data
    alias: "Solar: no data"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_data_stale
        to: "on"
        for: "00:10:00"
        id: "on"
      - trigger: state
        entity_id: sensor.site_battery_level
        to: unavailable
        for: "00:10:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_data_stale
        from: "on"
        to: "off"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - "{{ trigger.id != 'off' or states('sensor.site_battery_level') not in ['unknown', 'unavailable'] }}"
    actions:
      # After a restart the sensor starts out "on" without a change to trigger on: wait, then check
      # it. (Top level on purpose: a condition inside if/then only ends that block, not the automation.)
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_data_stale', 'on') }}"
      - action: script.solar_notify
        data:
          tag: no_data
          title: No solar data
          message: >-
            {% if trigger.id != 'off' %}No inverter data for 10 minutes. Check the inverter dongles and the
            network.{% else %}clear{% endif %}

  - id: solar_backup_overdue
    alias: "Solar: backup overdue"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_backup_overdue
        to: "on"
        for: "01:00:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_backup_overdue
        from: "on"
        to: "off"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      # After a restart the sensor starts out "on" without a change to trigger on: wait, then check
      # it. (Top level on purpose: a condition inside if/then only ends that block, not the automation.)
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_backup_overdue', 'on') }}"
      - action: script.solar_notify
        data:
          tag: backup
          title: No backup for 2 days
          message: >-
            {% if trigger.id != 'off' %}The solar monitor hasn't backed up to its USB stick for 2 days
            ({{ state_attr('sensor.site_last_backup', 'backup_message') }}). Check the stick is plugged into
            the Pi.{% else %}clear{% endif %}

  # Battery health: cells drifting apart, too cold or hot, low SOH, BMS fault, no full charge for 30 days.
  - id: solar_battery_health
    alias: "Solar: battery needs attention"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_battery_needs_attention
        to: "on"
        for: "00:30:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_battery_needs_attention
        from: "on"
        to: "off"
        for: "00:30:00"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - delay: "{{ '00:30:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_battery_needs_attention', 'on') }}"
      - action: script.solar_notify
        data:
          tag: battery_health
          title: Battery needs attention
          message: >-
            {% if trigger.id != 'off' %}{{ state_attr('sensor.site_battery_health', 'battery_health_text') }}
            Details on the solar monitor's Battery health page.{% else %}clear{% endif %}

  # Generator service (oil change): 200 h on the inverters' GEN input, 100 h on a DC charger.
  # Mark it serviced on the box's Generator page (http://<this box>/generator).
  - id: solar_generator_service_due
    alias: "Solar: generator service due"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_generator_service_due
        to: "on"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_generator_service_due
        from: "on"
        to: "off"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - delay: "{{ '00:05:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_generator_service_due', 'on') }}"
      - action: script.solar_notify
        data:
          tag: generator_service
          title: Generator service due
          message: >-
            {% if trigger.id != 'off' %}The generator has run {{ states('sensor.site_generator_hours_since_service') }} hours
            since its last service (every {{ state_attr('sensor.site_generator_hours_since_service', 'generator_service_interval') }} h):
            change the oil, then press "Serviced" on the solar monitor's Generator page.{% else %}clear{% endif %}

  # The box itself: overheating, a weak power supply, full or worn SSD, a container down.
  - id: solar_box_health
    alias: "Solar: the monitor box needs attention"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_box_needs_attention
        to: "on"
        for: "00:15:00"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.site_box_needs_attention
        from: "on"
        to: "off"
        for: "00:15:00"
        id: "off"
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - delay: "{{ '00:20:00' if trigger.id == 'start' else '00:00:00' }}"
      - condition: template
        value_template: "{{ trigger.id != 'start' or is_state('binary_sensor.site_box_needs_attention', 'on') }}"
      - action: script.solar_notify
        data:
          tag: box_health
          title: The solar monitor box needs attention
          message: >-
            {% if trigger.id != 'off' %}{{ state_attr('sensor.site_box_health', 'box_health_text') }}
            Details on the box's start page.{% else %}clear{% endif %}

  # Hand-started generator: from mid-afternoon on, will the battery last until the sun is back?
  - id: solar_generator_needed
    alias: "Solar: start the generator"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.site_generator_needed
        to: "on"
        for: "00:05:00"
      # second reminder at sunset if it still hasn't been started
      - trigger: sun
        event: sunset
        offset: "-00:30:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.site_generator_needed
        state: "on"
      - condition: numeric_state
        entity_id: sensor.site_generator_power
        below: 100
    actions:
      - action: script.solar_notify
        data:
          tag: generator
          title: Start the generator
          message: "{{ state_attr('sensor.site_generator_advice', 'advice_text') }}"

  - id: solar_generator_running
    alias: "Solar: generator started, clear the reminder"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.site_generator_power
        above: 500
        for: "00:02:00"
      - trigger: state
        entity_id: binary_sensor.site_generator_needed
        from: "on"
        to: "off"
    actions:
      - action: script.solar_notify
        data: {tag: generator, title: "", message: clear}

  # Daily summary: on/off and the time come from the setup page (packages/site.yaml).
  - id: solar_daily_summary
    alias: "Solar: daily summary"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.solar_summary_time
    conditions:
      - condition: state
        entity_id: input_boolean.solar_daily_summary
        state: "on"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.site_daily_summary
      - delay: "00:00:10"
      - action: script.solar_notify
        data:
          tag: summary
          title: "{{ state_attr('sensor.site_daily_summary', 'summary_title') }}"
          message: "{{ state_attr('sensor.site_daily_summary', 'summary_text') }}"

lovelace:
  dashboards:
    # phone-first: alerts, cameras, the enabled modules (written by the box: setup/hadashboard.py)
    solar-home:
      mode: yaml
      filename: dashboards/home.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
      require_admin: false
    solar-site:
      mode: yaml
      filename: dashboards/solar.yaml
      title: Solar
      icon: mdi:solar-power-variant
      show_in_sidebar: true
      require_admin: false
