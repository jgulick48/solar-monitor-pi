# Solar monitor stack. Started by solar-stack.service after solar-setup has
# written the generated files (.env, bridge/config.yml, mosquitto/passwd).
# The setup page (setup/solar_web.py) runs on the host on port 80.
name: solar
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - mosquitto-data:/mosquitto/data
    ports:
      # Home Assistant runs on the host network and connects here; not exposed to the LAN.
      - "127.0.0.1:1883:1883"

  bridge:
    image: jgulick48/lxp-bridge-go:2026.11.23-0324
    restart: unless-stopped
    command: ["-configFile", "/config/config.yml"]
    volumes:
      - ./bridge/config.yml:/config/config.yml:ro
    depends_on: [mosquitto]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    command:
      - -retentionPeriod=5y
      - -storageDataPath=/storage
      - -promscrape.config=/etc/vm/scrape.yml
      - -httpListenAddr=:8428
    volumes:
      - ./victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/storage
    ports:
      - "127.0.0.1:8428:8428"

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    env_file: .env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/solar-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [victoriametrics]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2
    restart: unless-stopped
    network_mode: host
    # Bluetooth adapter management (BLE sensors such as tank gauges)
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on: [mosquitto]

  # Cameras for the HDMI display (setup/cameras.py writes go2rtc/go2rtc.yaml from the setup page).
  # Turns the cameras' RTSP(S) streams into MSE for the kiosk browser; localhost only. Off unless .env has
  # COMPOSE_PROFILES=cameras (the cameras module is on).
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    profiles: [cameras]
    restart: unless-stopped
    # host network, listening on 127.0.0.1 only (go2rtc.yaml): the video doesn't pass through docker-proxy,
    # which cost the Pi 4 a few percent of CPU
    network_mode: host
    volumes:
      - ./go2rtc:/config

  # Remote access to Home Assistant through a Cloudflare Tunnel (setup page -> Remote access;
  # setup/tunnel.py). Off unless .env has COMPOSE_PROFILES=tunnel. Only HA is published.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    profiles: [tunnel]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: ./state/tunnel.env
        required: false
    depends_on: [homeassistant]

  # Remote support (setup page -> Remote support; setup/support.py): a second cloudflared with a
  # tunnel token from the helper's own Cloudflare account. Off unless COMPOSE_PROFILES has "support";
  # what it publishes (SSH, setup page, Grafana...) is set in that account, behind Cloudflare Access.
  cloudflared-support:
    image: cloudflare/cloudflared:2026.11.1
    profiles: [support]
    restart: unless-stopped
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20249", "run"]
    env_file:
      - path: ./state/support.env
        required: false

  # Spoken camera announcements on the wall display (setup page -> Screen and cameras -> Speak; setup/tts.py):
  # Piper text-to-speech. Off unless COMPOSE_PROFILES has "tts"; not in the image (about 200 MB), pulled when
  # turned on; it downloads the voice into its volume on first start. Localhost only.
  tts:
    image: rhasspy/wyoming-piper:2.5.4
    profiles: [tts]
    restart: unless-stopped
    command: ["--voice", "${TTS_VOICE:-en_US-lessac-medium}", "--uri", "tcp://0.0.0.0:10200",
              "--data-dir", "/data", "--download-dir", "/data"]
    ports:
      - "127.0.0.1:10200:10200"
    volumes:
      - tts-data:/data

  # Propane tank level from a Mopeka Pro Check over Bluetooth (setup/propane.py reads its /sensors on
  # 127.0.0.1:9811). Scans with a raw HCI socket, so host network and NET_RAW/NET_ADMIN; publishes the
  # tank to Home Assistant through MQTT discovery. Off unless the propane module is on.
  propane:
    image: jgulick48/pro-check-server:2026.11.17-2216
    profiles: [propane]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      LISTEN_ADDRESS: "127.0.0.1:9811"
      TANKS: ${PROPANE_TANKS:-}
      DEFAULT_TANK_TYPE: ${PROPANE_TANK_TYPE:-500g_h}
      MQTT_BROKER: "tcp://127.0.0.1:1883"
      MQTT_CLIENT_ID: solar-propane
      MQTT_USERNAME: homeassistant
      MQTT_PASSWORD: ${PROPANE_MQTT_PASSWORD:-}

  # Zigbee: Zigbee2MQTT for a network (PoE/Ethernet) coordinator; devices reach Home Assistant through MQTT
  # discovery. The connection comes from .env (the zigbee module); the rest from zigbee2mqtt/configuration.yaml,
  # seeded once. Its web page (pairing) is on port 8081. Off unless the zigbee module is on.
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.3
    profiles: [zigbee]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE_PORT:-}
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${ZIGBEE_ADAPTER:-ember}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "mqtt://mosquitto:1883"
      ZIGBEE2MQTT_CONFIG_MQTT_USER: homeassistant
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${ZIGBEE_MQTT_PASSWORD:-}
    ports:
      - "8081:8080"
    volumes:
      - ./zigbee2mqtt:/app/data
    depends_on: [mosquitto]

  # Z-Wave: Z-Wave JS UI for a network (PoE/Ethernet) controller. The controller's address comes from .env and
  # the security keys, region and Home Assistant server from zwave/box-settings.json (the zwave module writes both).
  # Host network: Home Assistant connects to its server on ws://127.0.0.1:3000; its web page is on port 8091.
  # Off unless the zwave module is on.
  zwave-js-ui:
    image: zwavejs/zwave-js-ui:11.25.2
    profiles: [zwave]
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      ZWAVE_PORT: ${ZWAVE_PORT:-}
      ZWAVE_EXTERNAL_SETTINGS: /usr/src/app/store/box-settings.json
      SESSION_SECRET: ${ZWAVE_SESSION_SECRET:-}
      PORT: "8091"
    volumes:
      - ./zwave:/usr/src/app/store

  # Backups to a USB stick (setup/backup.py runs it; not a long-running service).
  backup:
    image: restic/restic:0.20.0
    profiles: [backup]
    hostname: solar-monitor
    environment:
      RESTIC_REPOSITORY: /repo/repo
      RESTIC_PASSWORD_FILE: /repo/key
      RESTIC_CACHE_DIR: /cache
    volumes:
      - ./:/data/stack
      - vm-data:/data/vm
      - ${SOLAR_BACKUP_MOUNT:-/run/solar-backup}/solar-monitor-backup:/repo
      - restic-cache:/cache

volumes:
  mosquitto-data:
  vm-data:
  grafana-data:
  restic-cache:
  tts-data:
