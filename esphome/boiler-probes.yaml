# Boiler and floor-heating probes for the solar monitor's boiler module (wiki: "Boiler, propane and notifications").
#
# Board: Waveshare ESP32-P4-ETH with its PoE module (ESP32-P4, IP101 Ethernet), plugged into the carrier board
# (carrier/): eight probe ports P1-P8, each its own 1-Wire bus; the wired call for heat; two pump current clamps; a
# 0.96" SSD1306 OLED in the enclosure's lid and a button that wakes it. Runs ESPHome and joins Home Assistant through
# its ESPHome integration.
#
# Setup (esphome/README.md has the details):
#   1. Copy secrets.example.yaml to secrets.yaml and fill it in.
#   2. Flash once over USB (hold BOOT, press RESET): esphome run boiler-probes.yaml. After that it updates over the
#      network.
#   3. Plug each probe into its port (below). Each port is its own bus with one probe, so there are no addresses to
#      find: a probe is the port it's plugged into.
#
# The names below are only what Home Assistant shows: the boiler module's setup picks which Home Assistant
# temperature sensor is which, so plugging a probe into another port and picking it there is fine.

substitutions:
  name: boiler-probes
  friendly_name: Boiler probes
  probe_interval: 15s
  # what the OLED shows temperatures in: F or C (Home Assistant always gets Celsius and converts itself)
  oled_unit: F
  oled_on_minutes: "5"        # the OLED turns off after this (an OLED left on burns in); the lid button wakes it

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  on_boot:
    priority: -100
    then:
      - script.execute: oled_wake

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  phy_addr: 1

logger:
  level: INFO
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# A page on the board itself (http://boiler-probes.local) showing every reading, handy while plugging probes in.
web_server:
  port: 80
  version: 3

# ---------------------------------------------------------------------------------------------------------------
# Probe ports: one 1-Wire bus per port, each with its own 4.7 kOhm pull-up on the carrier. A cable fault only takes
# out its own probe. Ports P1-P4 are on the front (RESET side), P5-P8 on the back.
# ---------------------------------------------------------------------------------------------------------------
one_wire:
  - { platform: gpio, pin: GPIO33, id: p1 }
  - { platform: gpio, pin: GPIO27, id: p2 }
  - { platform: gpio, pin: GPIO23, id: p3 }
  - { platform: gpio, pin: GPIO21, id: p4 }
  - { platform: gpio, pin: GPIO32, id: p5 }
  - { platform: gpio, pin: GPIO26, id: p6 }
  - { platform: gpio, pin: GPIO22, id: p7 }
  - { platform: gpio, pin: GPIO20, id: p8 }

i2c:
  sda: GPIO7                    # the ESP board has the I2C pull-ups
  scl: GPIO8
  frequency: 400kHz

sensor:
  # Probes 1 to 3 are the minimum the boiler module needs; the others add accuracy or a reading. A port with no
  # probe just reads "unknown". (With one probe per bus, dallas_temp needs no address.)
  # P1. Floor supply: with P2, the heat delivered to the floor (manifold flow x temperature difference)
  - platform: dallas_temp
    one_wire_id: p1
    name: Floor supply
    id: floor_supply
    update_interval: ${probe_interval}
    resolution: 12
    accuracy_decimals: 2
  # P2. Floor return
  - platform: dallas_temp
    one_wire_id: p2
    name: Floor return
    id: floor_return
    update_interval: ${probe_interval}
    resolution: 12
    accuracy_decimals: 2
  # P3. Boiler supply: whether the boiler fires, how hot, and the outdoor-reset check
  - platform: dallas_temp
    one_wire_id: p3
    name: Boiler supply
    id: boiler_supply
    update_interval: ${probe_interval}
    resolution: 12
    accuracy_decimals: 2
  # P4. Boiler return: whether the boiler condenses (return under about 130 F), and the primary loop's difference
  - platform: dallas_temp
    one_wire_id: p4
    name: Boiler return
    id: boiler_return
    update_interval: ${probe_interval}
    resolution: 12
    accuracy_decimals: 2
  # P5. Hot water outlet: tells a hot-water draw from heating at once (without it, the water pump's plug does)
  - platform: dallas_temp
    one_wire_id: p5
    name: Hot water outlet
    id: hot_water
    update_interval: 5s
    resolution: 12
    accuracy_decimals: 2
  # P6, P7. Slab, near the boiler and at the far end of the loops: how the floor itself responds
  - platform: dallas_temp
    one_wire_id: p6
    name: Slab near boiler
    id: slab_near
    update_interval: 60s
    resolution: 12
    accuracy_decimals: 2
  - platform: dallas_temp
    one_wire_id: p7
    name: Slab far
    id: slab_far
    update_interval: 60s
    resolution: 12
    accuracy_decimals: 2
  # P8. Spare: a probe for anything else (an outdoor or room temperature, the propane regulator)
  - platform: dallas_temp
    one_wire_id: p8
    name: Probe P8
    id: probe_p8
    update_interval: 60s
    resolution: 12
    accuracy_decimals: 2

  # The floor's supply-minus-return difference, as the board sees it (the box applies its learned offsets itself).
  - platform: template
    name: Floor difference
    id: floor_difference
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: ${probe_interval}
    lambda: |-
      if (isnan(id(floor_supply).state) || isnan(id(floor_return).state)) return NAN;
      return id(floor_supply).state - id(floor_return).state;

  # Pump current clamps (SCT-013, 1 V at full scale, built-in burden) in the 3.5 mm jacks: CT1 on GPIO16, CT2 on
  # GPIO17 (the plug's sleeve), its tip on the bias (half of 3.3 V, so the AC swings around it). With no clamp in they
  # read about 0 A.
  - platform: adc
    pin: GPIO16
    id: adc_ct1
    attenuation: 12db
    update_interval: never
  - platform: ct_clamp
    sensor: adc_ct1
    name: Boiler pump current
    id: boiler_pump_current
    update_interval: 10s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.03 -> 1.0         # calibrate against a clamp meter: measured ADC value -> amps
  - platform: adc
    pin: GPIO17
    id: adc_ct2
    attenuation: 12db
    update_interval: never
  - platform: ct_clamp
    sensor: adc_ct2
    name: Floor pump current
    id: floor_pump_current
    update_interval: 10s
    sample_duration: 200ms
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.03 -> 1.0

  - platform: uptime
    name: Uptime
    entity_category: diagnostic

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP address
      id: ip_address
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

  # The wired call for heat: the thermostat's 24 VAC on the HEAT block's outer pins, through the carrier's AC-input
  # optocoupler, pulls GPIO46 low while the call is on (10 kOhm pull-up and 1 uF smoothing on the carrier).
  - platform: gpio
    name: Call for heat
    id: heat_call
    pin:
      number: GPIO46
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 2s          # AC through an optocoupler ripples: hold before changing
      - delayed_off: 2s

  # The lid button (BTN header: GPIO47 and GND): wakes the OLED.
  - platform: gpio
    id: oled_button
    pin:
      number: GPIO47
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - script.execute: oled_wake

# ---------------------------------------------------------------------------------------------------------------
# The OLED in the lid: the readings, a few at a time, changing every 4 seconds. It turns off after oled_on_minutes
# so it doesn't burn in, and the lid button (or a restart) turns it on again.
# ---------------------------------------------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
  - file: "gfonts://Roboto"
    id: font_big
    size: 16

script:
  - id: oled_wake
    mode: restart
    then:
      - lambda: id(oled).turn_on();
      - delay: !lambda "return ${oled_on_minutes} * 60 * 1000;"
      - lambda: id(oled).turn_off();

interval:
  - interval: 4s
    then:
      - display.page.show_next: oled
      - component.update: oled

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    update_interval: never      # redrawn by the interval above, with each page change
    pages:
      - id: page_floor
        lambda: |-
          auto t = [&](float c) -> std::string {
            if (isnan(c)) return "--";
            char b[16];
            snprintf(b, sizeof(b), "%.1f%s", strcmp("${oled_unit}", "F") == 0 ? c * 1.8f + 32 : c, "${oled_unit}");
            return b;
          };
          it.print(0, 0, id(font_small), "Floor supply / return");
          it.printf(0, 16, id(font_big), "%s", t(id(floor_supply).state).c_str());
          it.printf(64, 16, id(font_big), "%s", t(id(floor_return).state).c_str());
          it.print(0, 40, id(font_small), "Call for heat");
          it.print(90, 40, id(font_small), id(heat_call).state ? "ON" : "off");
      - id: page_boiler
        lambda: |-
          auto t = [&](float c) -> std::string {
            if (isnan(c)) return "--";
            char b[16];
            snprintf(b, sizeof(b), "%.1f%s", strcmp("${oled_unit}", "F") == 0 ? c * 1.8f + 32 : c, "${oled_unit}");
            return b;
          };
          it.print(0, 0, id(font_small), "Boiler supply / return");
          it.printf(0, 16, id(font_big), "%s", t(id(boiler_supply).state).c_str());
          it.printf(64, 16, id(font_big), "%s", t(id(boiler_return).state).c_str());
          it.print(0, 40, id(font_small), "Hot water");
          it.printf(70, 40, id(font_small), "%s", t(id(hot_water).state).c_str());
      - id: page_slab
        lambda: |-
          auto t = [&](float c) -> std::string {
            if (isnan(c)) return "--";
            char b[16];
            snprintf(b, sizeof(b), "%.1f%s", strcmp("${oled_unit}", "F") == 0 ? c * 1.8f + 32 : c, "${oled_unit}");
            return b;
          };
          it.print(0, 0, id(font_small), "Slab near / far");
          it.printf(0, 16, id(font_big), "%s", t(id(slab_near).state).c_str());
          it.printf(64, 16, id(font_big), "%s", t(id(slab_far).state).c_str());
          it.print(0, 40, id(font_small), "P8");
          it.printf(70, 40, id(font_small), "%s", t(id(probe_p8).state).c_str());
      - id: page_pumps
        lambda: |-
          it.print(0, 0, id(font_small), "Pumps (A)");
          it.printf(0, 16, id(font_small), "Boiler  %.2f", id(boiler_pump_current).state);
          it.printf(0, 30, id(font_small), "Floor   %.2f", id(floor_pump_current).state);
          it.printf(0, 48, id(font_small), "%s", id(ip_address).state.c_str());
